[package]
name = "seeker"
version = "0.1.0"
edition = "2021"

[features]
default = ["cpu"]
cpu = []
cuda = ["dep:cudarc"]

[dependencies]
anyhow = "1.0.101"
bs58 = "0.5.1"
getrandom = "0.4.1"
memmap2 = "0.9.10"
rayon = "1.11.0"
ripemd = "0.1.3"
secp256k1 = "0.31"
sha2 = "0.10.9"
cudarc = { version = "0.12", optional = true, default-features = false, features = ["driver", "nvrtc", "dynamic-linking", "cuda-12000"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[dev-dependencies]
tempfile = "3.27.0"
